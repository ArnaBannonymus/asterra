[build-system]
requires = []
build-backend = "backend"
backend-path = ["build_backend"]

[project]
name = "asterra"
version = "0.1.0"
description = "Support-aware machine learning for Earth observation"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Asterra Contributors" }]
keywords = [
  "earth-observation",
  "remote-sensing",
  "scikit-learn",
  "sparse-matrices",
  "spatial-ml",
  "support",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
geo = ["pyproj>=3.6", "shapely>=2.0"]
dev = ["build>=1.2", "pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5.0"]

[project.urls]
Homepage = "https://github.com/ArnaBannonymus/asterra"
Issues = "https://github.com/ArnaBannonymus/asterra/issues"
Changelog = "https://github.com/ArnaBannonymus/asterra/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
